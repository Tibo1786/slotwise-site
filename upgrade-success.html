<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slotwise — Upgraded</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 22px; font-weight: 600; margin-bottom: 12px; color: #25d366; }
    p { font-size: 15px; color: #555; line-height: 1.5; margin-bottom: 24px; }
    .subtext { font-size: 13px; color: #888; margin-top: 8px; }
    .subtext a { color: #888; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h1>You're on Pro!</h1>
    <p>Your subscription is active. Return to WhatsApp — Slotwise will pick up wherever you left off, including any booking that was pending.</p>
    <div class="subtext">Manage your subscription or get help anytime at <a href="mailto:contact@slotwise.eu">contact@slotwise.eu</a></div>
  </div>
</body>
</html>
